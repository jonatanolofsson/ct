name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install bats + pinned shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bats
          # Pin shellcheck so CI is reproducible and matches local `just check`
          # (distro shellcheck versions differ on which SC notes they emit).
          SC_VER=v0.10.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SC_VER}/shellcheck-${SC_VER}.linux.x86_64.tar.xz" \
            | tar -xJ
          sudo install -m 0755 "shellcheck-${SC_VER}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: lint
        run: |
          bash -n bin/ct bin/ct-autostart bin/ensure-nix install.sh
          shellcheck -x bin/ct bin/ct-autostart bin/ensure-nix install.sh
      - name: test
        run: bats tests/
