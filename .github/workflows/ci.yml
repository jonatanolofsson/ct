name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ct's tools come from its own flake (flake.nix, flake.lock), here as locally
      # (`direnv exec . just check`), so lint and tests run the same shellcheck and bats.
      # Upstream Nix, from the installer action pinned to its v23 release commit, with the
      # installer binary at a release tag and no diagnostics or summary.
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
        with:
          determinate: false
          diagnostic-endpoint: ""
          summarize: false
          source-tag: v3.24.1
      - name: check
        run: nix develop --command just check
